<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simpleton Budgeter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-analytics.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyDw3zueDw_lhlDzAoWi2k2-eIm1W2hACpg",
    authDomain: "simpleton-systems.firebaseapp.com",
    projectId: "simpleton-systems",
    storageBucket: "simpleton-systems.firebasestorage.app",
    messagingSenderId: "767895291692",
    appId: "1:767895291692:web:0e6f83d1e9c09c58488e89",
    measurementId: "G-JLKMDWTJ84"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);

        // --- State ---
        let currentUser = null;
        let transactions = [];
        let bills = [];
        let settings = { startingBalance: 0 };
        let currentTab = 'transactions';
        let unsubscribeSettings = null;
        let unsubscribeTx = null;
        let unsubscribeBills = null;

        // --- Auth Logic ---
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth Failed:", error);
                alert("Authentication failed. Please refresh.");
            }
        };

        // Start Auth process immediately in background
        initAuth();

        // Listen for Auth Changes
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                console.log("User Authenticated:", user.uid);
                
                // Update UI if we are waiting on the login screen
                const loginBtn = document.getElementById('login-btn');
                if (loginBtn) {
                    loginBtn.innerHTML = '<i class="fa-solid fa-arrow-right mr-2"></i> Enter Budget';
                    loginBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    loginBtn.disabled = false;
                }
                
                // Setup Realtime Listeners
                setupListeners(user.uid);
                
                // Update User Profile UI
                document.getElementById('user-id-display').innerText = `ID: ${user.uid.substring(0, 6)}...`;
            } else {
                currentUser = null;
                cleanupListeners();
                showLoginScreen();
            }
        });

        // --- Data Listeners ---
        function setupListeners(userId) {
            // 1. Settings (Balance)
            const settingsRef = doc(db, 'artifacts', appId, 'users', userId, 'data', 'settings');
            unsubscribeSettings = onSnapshot(settingsRef, (docSnap) => {
                if (docSnap.exists()) {
                    settings = docSnap.data();
                    document.getElementById('start-balance-input').value = settings.startingBalance;
                } else {
                    setDoc(settingsRef, { startingBalance: 0 });
                }
                updateDashboard();
            }, (error) => console.error("Settings Error:", error));

            // 2. Transactions
            // Note: We fetch all and sort in memory to avoid index requirements
            const txQuery = collection(db, 'artifacts', appId, 'users', userId, 'transactions');
            unsubscribeTx = onSnapshot(txQuery, (snapshot) => {
                transactions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // Sort by date descending
                transactions.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                updateDashboard();
                renderTransactions();
            }, (error) => console.error("Transactions Error:", error));

            // 3. Bills
            const billsQuery = collection(db, 'artifacts', appId, 'users', userId, 'bills');
            unsubscribeBills = onSnapshot(billsQuery, (snapshot) => {
                bills = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderBills();
            }, (error) => console.error("Bills Error:", error));
        }

        function cleanupListeners() {
            if (unsubscribeSettings) unsubscribeSettings();
            if (unsubscribeTx) unsubscribeTx();
            if (unsubscribeBills) unsubscribeBills();
        }

        // --- UI Navigation ---
        window.enterApp = () => {
            if (!currentUser) {
                // If clicked before auth is ready (rare), show loading
                document.getElementById('login-btn').innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Connecting...';
                return;
            }
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
        };

        function showLoginScreen() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-content').classList.add('hidden');
        }

        window.handleLogout = async () => {
            // In this specific environment, true signout is tricky because the token might be re-injected.
            // We simulate it by reloading to reset state or showing the login screen.
            location.reload(); 
        };

        // --- Core App Logic ---

        window.updateStartingBalance = async (val) => {
            if (!currentUser) return;
            const amount = parseFloat(val) || 0;
            const settingsRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'settings');
            await setDoc(settingsRef, { startingBalance: amount }, { merge: true });
        };

        window.addTransaction = async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            btn.disabled = true;

            try {
                const desc = document.getElementById('tx-desc').value;
                const amount = parseFloat(document.getElementById('tx-amount').value);
                const type = document.getElementById('tx-type').value;
                const date = document.getElementById('tx-date').value || new Date().toISOString().split('T')[0];

                if (!desc || isNaN(amount)) throw new Error("Invalid Input");

                await addDoc(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'transactions'), {
                    description: desc,
                    amount: amount,
                    type: type,
                    date: date,
                    createdAt: new Date().toISOString()
                });

                document.getElementById('tx-form').reset();
                document.getElementById('tx-date').valueAsDate = new Date();
            } catch (err) {
                console.error(err);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };

        window.addBill = async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const name = document.getElementById('bill-name').value;
            const amount = parseFloat(document.getElementById('bill-amount').value);
            const freq = document.getElementById('bill-freq').value;

            if (!name || isNaN(amount)) return;

            await addDoc(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'bills'), {
                name: name,
                amount: amount,
                frequency: freq,
                createdAt: new Date().toISOString()
            });

            document.getElementById('bill-form').reset();
        };

        window.deleteItem = async (collectionName, id) => {
            if (!currentUser || !confirm('Delete this item?')) return;
            await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, collectionName, id));
        };

        window.payBill = async (name, amount) => {
            if (!currentUser) return;
            const date = new Date().toISOString().split('T')[0];
            
            // Create expense transaction
            await addDoc(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'transactions'), {
                description: `Bill: ${name}`,
                amount: amount,
                type: 'expense',
                date: date,
                createdAt: new Date().toISOString()
            });

            showToast(`Paid ${name} $${amount}`);
            switchTab('transactions');
        };

        // --- UI Rendering ---

        function updateDashboard() {
            const startBal = parseFloat(settings.startingBalance) || 0;
            
            const totalIncome = transactions
                .filter(t => t.type === 'income')
                .reduce((sum, t) => sum + (parseFloat(t.amount) || 0), 0);
            
            const totalExpense = transactions
                .filter(t => t.type === 'expense')
                .reduce((sum, t) => sum + (parseFloat(t.amount) || 0), 0);

            const currentBal = startBal + totalIncome - totalExpense;

            // Animate Numbers (Simple)
            document.getElementById('display-balance').innerText = `$${currentBal.toFixed(2)}`;
            document.getElementById('display-income').innerText = `+$${totalIncome.toFixed(2)}`;
            document.getElementById('display-expense').innerText = `-$${totalExpense.toFixed(2)}`;
            
            const balEl = document.getElementById('display-balance');
            balEl.className = `text-4xl font-bold mb-4 tracking-tight transition-colors duration-300 ${currentBal < 0 ? 'text-red-200' : 'text-white'}`;
        }

        function renderTransactions() {
            const container = document.getElementById('tx-list');
            container.innerHTML = '';

            if (transactions.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-48 text-gray-400">
                        <i class="fa-solid fa-receipt text-3xl mb-2 opacity-50"></i>
                        <p>No transactions yet</p>
                    </div>`;
                return;
            }

            transactions.forEach(tx => {
                const isExpense = tx.type === 'expense';
                const sign = isExpense ? '-' : '+';
                const colorClass = isExpense ? 'text-red-600' : 'text-green-600';
                const bgClass = isExpense ? 'bg-red-50' : 'bg-green-50';
                const icon = isExpense ? 'fa-arrow-trend-down' : 'fa-arrow-trend-up';

                const el = document.createElement('div');
                el.className = `group flex items-center justify-between p-3 rounded-lg border border-gray-100 hover:border-blue-200 hover:shadow-md transition-all mb-2 bg-white`;
                el.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full ${bgClass} ${colorClass} flex items-center justify-center shrink-0">
                            <i class="fa-solid ${icon}"></i>
                        </div>
                        <div>
                            <div class="font-medium text-gray-800">${tx.description}</div>
                            <div class="text-xs text-gray-400">${tx.date}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold ${colorClass}">${sign}$${parseFloat(tx.amount).toFixed(2)}</span>
                        <button onclick="deleteItem('transactions', '${tx.id}')" class="opacity-0 group-hover:opacity-100 w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-gray-300 hover:text-red-500 transition-all">
                            <i class="fa-solid fa-trash text-sm"></i>
                        </button>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function renderBills() {
            const container = document.getElementById('bill-list');
            container.innerHTML = '';

            if (bills.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-48 text-gray-400">
                        <i class="fa-solid fa-calendar text-3xl mb-2 opacity-50"></i>
                        <p>No bills set up</p>
                    </div>`;
                return;
            }

            bills.forEach(bill => {
                const el = document.createElement('div');
                el.className = `group flex flex-col sm:flex-row sm:items-center justify-between p-4 rounded-lg border border-gray-200 bg-white hover:shadow-md transition-all mb-3`;
                el.innerHTML = `
                    <div class="flex items-center gap-3 mb-3 sm:mb-0">
                        <div class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-file-invoice-dollar"></i>
                        </div>
                        <div>
                            <div class="font-bold text-gray-800">${bill.name}</div>
                            <div class="text-xs text-gray-500 uppercase tracking-wide bg-gray-100 px-2 py-0.5 rounded inline-block mt-1">${bill.frequency}</div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between sm:justify-end gap-4 w-full sm:w-auto">
                        <span class="font-bold text-gray-900 text-lg">$${parseFloat(bill.amount).toFixed(2)}</span>
                        <div class="flex gap-2">
                            <button onclick="payBill('${bill.name}', ${bill.amount})" class="px-3 py-1.5 bg-green-100 text-green-700 rounded hover:bg-green-200 text-sm font-medium transition-colors flex items-center gap-1">
                                <i class="fa-solid fa-check"></i> Pay
                            </button>
                            <button onclick="deleteItem('bills', '${bill.id}')" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-gray-300 hover:text-red-500 transition-colors">
                                <i class="fa-solid fa-trash text-sm"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        window.switchTab = (tab) => {
            currentTab = tab;
            
            const btnTx = document.getElementById('tab-btn-tx');
            const btnBills = document.getElementById('tab-btn-bills');
            
            if (tab === 'transactions') {
                btnTx.className = 'flex-1 py-3 text-center font-medium text-blue-600 border-b-2 border-blue-600 bg-blue-50/50';
                btnBills.className = 'flex-1 py-3 text-center font-medium text-gray-500 hover:text-gray-700 hover:bg-gray-50';
            } else {
                btnTx.className = 'flex-1 py-3 text-center font-medium text-gray-500 hover:text-gray-700 hover:bg-gray-50';
                btnBills.className = 'flex-1 py-3 text-center font-medium text-blue-600 border-b-2 border-blue-600 bg-blue-50/50';
            }

            document.getElementById('view-transactions').classList.toggle('hidden', tab !== 'transactions');
            document.getElementById('view-bills').classList.toggle('hidden', tab !== 'bills');
        };

        window.showToast = (msg) => {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-3 rounded-lg shadow-xl transform transition-all duration-500 translate-y-10 opacity-0 z-50 flex items-center gap-3';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-green-400"></i> <span>${msg}</span>`;
            document.body.appendChild(toast);
            
            // Trigger animation
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        };

        // Init UI
        window.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('tx-date');
            if(dateInput) dateInput.valueAsDate = new Date();
        });

    </script>
</head>
<body class="bg-slate-100 text-gray-800 font-sans h-screen overflow-hidden flex flex-col">

    <!-- 1. Login/Landing Screen -->
    <div id="login-screen" class="fixed inset-0 bg-slate-100 z-50 flex flex-col items-center justify-center p-6 transition-all duration-500">
        <div class="max-w-sm w-full bg-white rounded-2xl shadow-xl p-8 text-center space-y-6">
            <div class="w-20 h-20 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-blue-200">
                <i class="fa-solid fa-wallet text-3xl text-white"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Simple Budget</h1>
                <p class="text-gray-500 mt-2">Track expenses & recurring bills securely in the cloud.</p>
            </div>
            
            <button id="login-btn" onclick="enterApp()" disabled class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-all transform hover:scale-[1.02] active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center">
                <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Connecting...
            </button>
            
            <p class="text-xs text-gray-400">Secured by Firebase • Private Data</p>
        </div>
    </div>

    <!-- 2. Main App Content -->
    <div id="app-content" class="hidden flex-1 flex flex-col max-w-lg mx-auto w-full h-full bg-white shadow-2xl sm:rounded-xl sm:my-4 sm:h-[95vh] relative overflow-hidden transition-opacity duration-500">
        
        <!-- Header -->
        <header class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-6 pb-8 shrink-0 relative shadow-lg">
            <div class="flex justify-between items-start mb-6">
                <h1 class="font-medium opacity-90 flex items-center gap-2">
                    <i class="fa-solid fa-wallet"></i> My Wallet
                </h1>
                <div class="flex items-center gap-3">
                    <div class="text-right">
                        <div class="text-[10px] uppercase opacity-75 font-bold tracking-wider">Account</div>
                        <div id="user-id-display" class="text-xs font-mono bg-white/10 px-2 py-0.5 rounded">...</div>
                    </div>
                    <button onclick="handleLogout()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-colors" title="Logout">
                        <i class="fa-solid fa-right-from-bracket text-xs"></i>
                    </button>
                </div>
            </div>

            <div class="text-center">
                <h2 class="text-sm font-light opacity-80 mb-1">Total Balance</h2>
                <div id="display-balance" class="text-4xl font-bold mb-6 tracking-tight transition-colors">$0.00</div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white/10 rounded-xl p-3 backdrop-blur-sm border border-white/10">
                    <div class="flex items-center gap-2 mb-1">
                        <div class="w-2 h-2 rounded-full bg-green-400"></div>
                        <div class="text-xs opacity-75 font-medium">Income</div>
                    </div>
                    <div id="display-income" class="font-bold text-white text-lg tracking-wide">+$0.00</div>
                </div>
                <div class="bg-white/10 rounded-xl p-3 backdrop-blur-sm border border-white/10">
                    <div class="flex items-center gap-2 mb-1">
                        <div class="w-2 h-2 rounded-full bg-red-400"></div>
                        <div class="text-xs opacity-75 font-medium">Expenses</div>
                    </div>
                    <div id="display-expense" class="font-bold text-white text-lg tracking-wide">-$0.00</div>
                </div>
            </div>

            <!-- Start Balance Input Overlay -->
            <div class="absolute -bottom-6 left-6 right-6 bg-white rounded-xl shadow-lg p-4 flex items-center justify-between border border-gray-100 ring-1 ring-black/5">
                <div class="flex items-center gap-2 text-gray-500">
                    <i class="fa-solid fa-vault text-blue-500"></i>
                    <span class="text-xs font-bold uppercase tracking-wide">Starting Balance</span>
                </div>
                <div class="flex items-center bg-gray-50 rounded px-2">
                    <span class="text-gray-400 text-sm">$</span>
                    <input type="number" id="start-balance-input" onchange="updateStartingBalance(this.value)" class="w-24 text-right font-bold text-gray-800 outline-none bg-transparent py-1 border-b border-transparent focus:border-blue-500 transition-colors" placeholder="0.00">
                </div>
            </div>
        </header>

        <!-- Main Body -->
        <div class="flex-1 overflow-hidden flex flex-col pt-10">
            
            <!-- Tabs -->
            <div class="flex border-b border-gray-100 shrink-0 px-6 gap-2">
                <button id="tab-btn-tx" onclick="switchTab('transactions')" class="flex-1 py-3 text-center font-medium text-blue-600 border-b-2 border-blue-600 bg-blue-50/50 rounded-t-lg transition-colors">
                    Transactions
                </button>
                <button id="tab-btn-bills" onclick="switchTab('bills')" class="flex-1 py-3 text-center font-medium text-gray-500 hover:text-gray-700 hover:bg-gray-50 rounded-t-lg transition-colors">
                    Recurring Bills
                </button>
            </div>

            <!-- View: Transactions -->
            <div id="view-transactions" class="flex-1 flex flex-col overflow-hidden">
                <!-- Add Form -->
                <form id="tx-form" onsubmit="addTransaction(event)" class="p-4 bg-gray-50/80 border-b border-gray-200 shrink-0">
                    <div class="flex gap-2 mb-3">
                        <select id="tx-type" class="p-2.5 rounded-lg border border-gray-300 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none bg-white">
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                        <input type="number" step="0.01" id="tx-amount" placeholder="Amount" class="flex-1 p-2.5 rounded-lg border border-gray-300 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none" required>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="tx-desc" placeholder="Description (e.g. Groceries)" class="flex-1 p-2.5 rounded-lg border border-gray-300 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none" required>
                        <input type="date" id="tx-date" class="w-10 p-2.5 rounded-lg border border-gray-300 text-sm focus:border-blue-500 outline-none text-transparent focus:text-gray-600 focus:w-32 transition-all relative z-10" title="Select Date">
                        <button type="submit" class="bg-blue-600 text-white w-12 rounded-lg hover:bg-blue-700 shadow-sm flex items-center justify-center transition-all active:scale-95">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </form>

                <!-- List -->
                <div id="tx-list" class="flex-1 overflow-y-auto p-4 space-y-1 bg-white">
                    <!-- Transactions injected here -->
                </div>
            </div>

            <!-- View: Bills -->
            <div id="view-bills" class="hidden flex-1 flex flex-col overflow-hidden">
                <!-- Add Form -->
                <form id="bill-form" onsubmit="addBill(event)" class="p-4 bg-indigo-50/50 border-b border-indigo-100 shrink-0">
                    <div class="text-xs font-bold text-indigo-400 uppercase mb-2 flex items-center gap-1">
                        <i class="fa-solid fa-plus-circle"></i> New Subscription / Bill
                    </div>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="bill-name" placeholder="Name (e.g. Netflix)" class="flex-1 p-2.5 rounded-lg border border-indigo-200 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" required>
                        <input type="number" step="0.01" id="bill-amount" placeholder="Amount" class="w-24 p-2.5 rounded-lg border border-indigo-200 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" required>
                    </div>
                    <div class="flex gap-2">
                        <select id="bill-freq" class="flex-1 p-2.5 rounded-lg border border-indigo-200 text-sm focus:border-indigo-500 outline-none bg-white">
                            <option value="Monthly">Monthly</option>
                            <option value="Weekly">Weekly</option>
                            <option value="Yearly">Yearly</option>
                        </select>
                        <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 text-sm font-medium shadow-sm transition-all active:scale-95">
                            Add Bill
                        </button>
                    </div>
                </form>

                <!-- List -->
                <div id="bill-list" class="flex-1 overflow-y-auto p-4 bg-slate-50">
                    <!-- Bills injected here -->
                </div>
            </div>
        </div>
    </div>
</body>
</html>
